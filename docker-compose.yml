services:
  postgres:
    image: postgres:16-alpine
    container_name: orderproof-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: orderproof
      POSTGRES_PASSWORD: orderproof
      POSTGRES_DB: orderproof
    ports:
      - "5433:5432"
    volumes:
      - orderproof_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderproof -d orderproof"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orderproof_pgdata:
